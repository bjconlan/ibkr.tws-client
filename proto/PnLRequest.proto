syntax = "proto3";

package protobuf;

option java_outer_classname = "PnLRequestProto";
option java_package = "io.github.bjconlan.ibkr.proto";
option csharp_namespace = "IBApi.protobuf";

message PnLRequest {
    optional int32 reqId = 1; // Unique request identifier used for tracking across EWrapper.
	optional string account = 2; // The IBKR account identifier to affiliate the request with.
	optional string modelCode = 3; // Financial advisor model portfolio code identifier. Individual accounts should pass an empty string.
}
