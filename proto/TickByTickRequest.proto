syntax = "proto3";

package protobuf;

import "Contract.proto";

option java_outer_classname = "TickByTickRequestProto";
option java_package = "io.github.bjconlan.ibkr.proto";
option csharp_namespace = "IBApi.protobuf";

message TickByTickRequest {
    optional int32 reqId = 1; // Unique request identifier used for tracking across EWrapper.
	optional Contract contract = 2; // Contract object containing defining characteristics for ticker.
	optional string tickType = 3; // Type of data the tick represents.
    optional int32 numberOfTicks = 4; // Number of distinct data points. Max is 1000 per request.
	optional bool ignoreSize = 5; // Omit updates that reflect only changes in size, and not price. Applicable to Bid\_Ask data requests.
}
