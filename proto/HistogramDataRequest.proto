syntax = "proto3";

package protobuf;

import "Contract.proto";

option java_outer_classname = "HistogramDataRequestProto";
option java_package = "io.github.bjconlan.ibkr.proto";
option csharp_namespace = "IBApi.protobuf";

message HistogramDataRequest {
    optional int32 reqId = 1; // Unique request identifier used for tracking across EWrapper.
	optional Contract contract = 2; // Contract object containing defining characteristics for ticker.
	optional bool useRTH = 3; // Declare that the request should only include Regular Trading Hours. Extended trading hours will be excluded.
	optional string timePeriod = 4; // Range of time covered by historgram.
}
