syntax = "proto3";

package protobuf;

import "Contract.proto";

option java_outer_classname = "RealTimeBarsRequestProto";
option java_package = "io.github.bjconlan.ibkr.proto";
option csharp_namespace = "IBApi.protobuf";

message RealTimeBarsRequest {
    optional int32 reqId = 1; // Unique request identifier used for tracking across EWrapper.
	optional Contract contract = 2; // Contract object containing defining characteristics for ticker.
    optional int32 barSize = 3; // Currently being ignored.
	optional string whatToShow = 4; // Data source type.
	optional bool useRTH = 5; // Declare that the request should only include Regular Trading Hours. Extended trading hours will be excluded.
    map<string, string> realTimeBarsOptions = 6; // Internal use. Flag special behavior or properties for real time bar rquests.
}
