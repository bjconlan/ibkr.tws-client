syntax = "proto3";

package protobuf;

option java_outer_classname = "NewsArticleRequestProto";
option java_package = "io.github.bjconlan.ibkr.proto";
option csharp_namespace = "IBApi.protobuf";

message NewsArticleRequest {
    optional int32 reqId = 1; // Unique request identifier used for tracking across EWrapper.
    optional string providerCode = 2; // News provider code based on requested data.
    optional string articleId = 3; // Identifier used to track the news article. See [EClient.reqNewsArticle](/tws-api/doc/news/news-articles/request-news-articles) for more details.
    map<string, string> newsArticleOptions = 4; // Reserved for internal use. Should be defined as null.
}
