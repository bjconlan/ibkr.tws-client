syntax = "proto3";

package protobuf;

option java_outer_classname = "MessageConfigProto";
option java_package = "io.github.bjconlan.ibkr.proto";
option csharp_namespace = "IBApi.protobuf";

message MessageConfig {
    optional int32 id = 1; // The order's unique identifier. If a new order is placed with an order ID less than or equal to the order ID of a previous order an error will occur.
    optional string title = 2; // Message headline or summary.
    optional string message = 3; // The news bulletin context.
    optional string defaultAction = 4; // Default action for handling the message. Supports "Yes", "No", and "Hidden".
    optional bool enabled = 5; // Declare that the message should be enabled to warn based on given actions.
}
