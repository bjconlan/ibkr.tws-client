syntax = "proto3";

package protobuf;

import "OrderCancel.proto";

option java_outer_classname = "CancelOrderRequestProto";
option java_package = "io.github.bjc.ibkr.proto";
option csharp_namespace = "IBApi.protobuf";

message CancelOrderRequest {
    optional int32 orderId = 1; // The API client's order id.
    optional OrderCancel orderCancel = 2; // An OrderCancel object that can receive the manualOrderCancelTime, manualOrderIndicator, and extOperator fields. See OrderCancel Reference for more insight on the [OrderCancel class](https://www.interactivebrokers.com/docs/tws-api/ref/order-cancel).
}
