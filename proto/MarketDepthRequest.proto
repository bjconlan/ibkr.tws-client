syntax = "proto3";

package protobuf;

import "Contract.proto";

option java_outer_classname = "MarketDepthRequestProto";
option java_package = "io.github.bjconlan.ibkr.proto";
option csharp_namespace = "IBApi.protobuf";

message MarketDepthRequest {
    optional int32 reqId = 1; // Unique request identifier used for tracking across EWrapper.
    optional Contract contract = 2; // Contract object containing defining characteristics for ticker.
    optional int32 numRows = 3; // The number of rows on each side of the order book.
    optional bool isSmartDepth = 4; // True to request market data from SMART rather than a direct exchange.
    map<string, string> marketDepthOptions = 5; // Internal use. Unique attributes for market data request.
}
