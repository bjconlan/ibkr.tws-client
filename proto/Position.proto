syntax = "proto3";

package protobuf;

import "Contract.proto";

option java_outer_classname = "PositionProto";
option java_package = "io.github.bjconlan.ibkr.proto";
option csharp_namespace = "IBApi.protobuf";

message Position {
    optional string account = 1; // The IBKR account identifier to affiliate the request with.
	optional Contract contract = 2; // Contract object containing defining characteristics for ticker.
    optional string position = 3; // The number of shares held.
    optional double avgCost = 4; // Average cost of the overall position.
}
