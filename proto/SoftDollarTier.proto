syntax = "proto3";

package protobuf;

option java_outer_classname = "SoftDollarTierProto";
option java_package = "io.github.bjc.ibkr.proto";
option csharp_namespace = "IBApi.protobuf";

message SoftDollarTier {
    optional string name = 1; // The name of the Soft Dollar Tier.
    optional string value = 2; // The value of the Soft Dollar Tier.
    optional string displayName = 3; // The display name of the Soft Dollar Tier.
}
