syntax = "proto3";

package protobuf;

option java_outer_classname = "ApiPrecautionsConfigProto";
option java_package = "io.github.bjconlan.ibkr.proto";
option csharp_namespace = "IBApi.protobuf";

message ApiPrecautionsConfig {
    optional bool bypassOrderPrecautions = 1; // If set to true, all order precautions will be bypassed and directly submitted without warning.
    optional bool bypassBondWarning = 2; // Bypass order precautions related to Bond trading.
    optional bool bypassNegativeYieldConfirmation = 3; // If true, you are electing to bypass any warning that your API-transmitted order will result in a negative yield to worst (YTW), excluding commissions. These orders will be executed without warning.
    optional bool bypassCalledBondWarning = 4; // If set to true, you are electing to bypass warning regarding called bond contract used in order.
    optional bool bypassSameActionPairTradeWarning = 5; // If set to true, orders will submit for same-action combos without warning.
    optional bool bypassFlaggedAccountsWarning = 6; // Bypass warnings against flagged accounts submitting orders.
    optional bool bypassPriceBasedVolatilityWarning = 7; // If set to true, order will be submitted in spite of volatility concerns for the order.
    optional bool bypassRedirectOrderWarning = 8; // If set to true, direct routed orders will be submitted without warning.
    optional bool bypassNoOverfillProtection = 9; // Waive warnings that your submitted order is being passed without overfill protection.
    optional bool bypassRouteMarketableToBBO = 10; // If set to true, orders will route to designated exchanges regardless of current best bid and offer.
}
