syntax = "proto3";

package protobuf;

import "Contract.proto";

option java_outer_classname = "PortfolioValueProto";
option java_package = "io.github.bjconlan.ibkr.proto";
option csharp_namespace = "IBApi.protobuf";

message PortfolioValue {
	optional Contract contract = 1; // Contract object containing defining characteristics for ticker.
    optional string position = 2; // The number of shares held.
    optional double marketPrice = 3; // The instrument's unitary price.
    optional double marketValue = 4; // Total market value of the instrument.
    optional double averageCost = 5; // Average cost of the overall position.
    optional double unrealizedPNL = 6; // Unrealized profit and loss for the current day's trading session.
    optional double realizedPNL = 7; // Daily realized profit and loss on the position.
    optional string accountName = 8; // The account identifier.
}
