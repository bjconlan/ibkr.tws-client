syntax = "proto3";

package protobuf;

import "LockAndExitConfig.proto";
import "MessageConfig.proto";
import "ApiConfig.proto";
import "OrdersConfig.proto";
import "UpdateConfigWarning.proto";

option java_outer_classname = "UpdateConfigRequestProto";
option java_package = "io.github.bjconlan.ibkr.proto";
option csharp_namespace = "IBApi.protobuf";

message UpdateConfigRequest {
    optional int32 reqId = 1; // Unique request identifier used for tracking across EWrapper.
    optional LockAndExitConfig lockAndExit = 2; // API Settings configuration for the "Lock and Exit" Global Configuration page.
    repeated MessageConfig messages = 3; // Complementary messages identifying settings.
    optional ApiConfig api = 4; // Host object of all Global Configuration -> API sub-menu settings.
    optional OrdersConfig orders = 5; // Order configuration settings from the Global Configuration.
    repeated UpdateConfigWarning acceptedWarnings = 6; // A list of warning messages displayed in the Global Configuration -> Messages.
    optional bool resetAPIOrderSequence = 7; // Submit as true to reset the orderId sequence back to 0.
}
