syntax = "proto3";

package protobuf;

option java_outer_classname = "OrderAllocationProto";
option java_package = "io.github.bjc.ibkr.proto";
option csharp_namespace = "IBApi.protobuf";

message OrderAllocation {
    optional string account = 1; // References the Account ID, i.e. U1234567, being allocated to.
    optional string position = 2; // References the current position of the account being allocated to.
    optional string positionDesired = 3; // States the full position increase intended by the current trade.
    optional string positionAfter = 4; // Size of the position once the order has been allocated.
    optional string desiredAllocQty = 5; // Reference the quantity to increase by based on allocation.
    optional string allowedAllocQty = 6; // References the maximum allowed quantity increase.
    optional bool isMonetary = 7; // Denotes whether the order is a monetary allocation (true) or whole share allocation (false).
}
