syntax = "proto3";

package protobuf;

import "TickAttribBidAsk.proto";

option java_outer_classname = "HistoricalTickBidAskProto";
option java_package = "io.github.bjconlan.ibkr.proto";
option csharp_namespace = "IBApi.protobuf";

message HistoricalTickBidAsk {
    optional int64 time = 1; // The UNIX timestamp of the historical tick.
	optional TickAttribBidAsk tickAttribBidAsk = 2; // Unique attributes of the tick data.
    optional double priceBid = 3; // Buy side price of the order.
    optional double priceAsk = 4; // Sell side price of the order.
    optional string sizeBid = 5; // Number of shares in the buy side.
    optional string sizeAsk = 6; // Number of shares in the sell side.
}
