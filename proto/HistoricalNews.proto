syntax = "proto3";

package protobuf;

option java_outer_classname = "HistoricalNewsProto";
option java_package = "io.github.bjconlan.ibkr.proto";
option csharp_namespace = "IBApi.protobuf";

message HistoricalNews {
    optional int32 reqId = 1; // Unique request identifier used for tracking across EWrapper.
    optional string time = 2; // Trigger time for the request. Formatted as HH:MM:ss (UTC assumed if timezone note set).
    optional string providerCode = 3; // News provider code based on requested data.
    optional string articleId = 4; // Identifier used to track the news article. See [EClient.reqNewsArticle](/tws-api/doc/news/news-articles/request-news-articles) for more details.
    optional string headline = 5; // Headline of the provided news article.
}
