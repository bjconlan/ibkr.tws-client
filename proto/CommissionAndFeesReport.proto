syntax = "proto3";

package protobuf;

option java_outer_classname = "CommissionAndFeesReportProto";
option java_package = "io.github.bjconlan.ibkr.proto";
option csharp_namespace = "IBApi.protobuf";

message CommissionAndFeesReport {
    optional string execId = 1; // The execution's identifier affiliated with this commission.
    optional double commissionAndFees = 2; // The combined cost of commissions and fees.
    optional string currency = 3; // The currency denoting the value of the commissionAndFees.
    optional double realizedPNL = 4; // The realized profit and loss from the execution.
    optional double bondYield = 5; // Annual interest divided by mark price.
    optional string yieldRedemptionDate = 6; // date expressed in yyyymmdd format.
}
