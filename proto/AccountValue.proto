syntax = "proto3";

package protobuf;

option java_outer_classname = "AccountValueProto";
option java_package = "io.github.bjconlan.ibkr.proto";
option csharp_namespace = "IBApi.protobuf";

message AccountValue {
    optional string key = 1; // The value being updated.
    optional string value = 2; // Representative information for a given Key.
    optional string currency = 3; // The underlying's currency.
    optional string accountName = 4; // The account identifier.
}
