syntax = "proto3";

package protobuf;

option java_outer_classname = "DepthMarketDataDescriptionProto";
option java_package = "io.github.bjconlan.ibkr.proto";
option csharp_namespace = "IBApi.protobuf";

message DepthMarketDataDescription {
    optional string exchange = 1; // The destination exchange.
    optional string secType = 2; // The security's type: STK – stock (or ETF) OPT – option FUT – future IND – index FOP – futures option CASH – forex pair BAG – combo WAR – warrant BOND- bond CMDTY- commodity NEWS- news FUND- mutual fund.
    optional string listingExch = 3; // The primary exchange where the contract is listed.
    optional string serviceDataType = 4; // A list containing all available exchanges offering market depth.
    optional int32 aggGroup = 5; // Aggregated group Indicates the smart-routing group to which a contract belongs. contracts which cannot be smart-routed have aggGroup = -1.
}
